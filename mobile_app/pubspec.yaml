name: ease_home_service
description: Ease Home Service Mobile Application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State Management & Routing
  flutter_riverpod: ^2.4.0
  go_router: ^13.0.0
  
  # Networking
  dio: ^5.3.0

  # Firebase Services
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  firebase_messaging: any
  firebase_database: any

  # Maps & Location
  google_maps_flutter: any
  geolocator: any

  # Utilities
  image_picker: any
  intl: any
  shared_preferences: any
  flutter_local_notifications: any
  flutter_dotenv: ^5.1.0

  # UI & Media
  fl_chart: any
  cached_network_image: any
  shimmer: any
  lottie: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
